<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Network - Главная</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-users"></i> Social Network
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#" onclick="showLogin()">Войти</a>
                <a class="nav-link" href="#" onclick="showRegister()">Регистрация</a>
            </div>
        </div>
    </nav>

    <!-- Главный контент -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- Форма входа -->
                <div id="loginForm" class="card">
                    <div class="card-header">
                        <h3 class="text-center">Вход в систему</h3>
                    </div>
                    <div class="card-body">
                        <form id="loginFormElement">
                            <div class="mb-3">
                                <label for="loginUsername" class="form-label">Имя пользователя</label>
                                <input type="text" class="form-control" id="loginUsername" required>
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="loginPassword" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Войти</button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <p>Нет аккаунта? <a href="#" onclick="showRegister()">Зарегистрироваться</a></p>
                        </div>
                    </div>
                </div>

                <!-- Форма регистрации -->
                <div id="registerForm" class="card" style="display: none;">
                    <div class="card-header">
                        <h3 class="text-center">Регистрация</h3>
                    </div>
                    <div class="card-body">
                        <form id="registerFormElement">
                            <div class="mb-3">
                                <label for="regUsername" class="form-label">Имя пользователя</label>
                                <input type="text" class="form-control" id="regUsername" required>
                            </div>
                            <div class="mb-3">
                                <label for="regEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="regEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="regPassword" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="regPassword" required>
                            </div>
                            <div class="mb-3">
                                <label for="regConfirmPassword" class="form-label">Подтвердите пароль</label>
                                <input type="password" class="form-control" id="regConfirmPassword" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">Зарегистрироваться</button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <p>Уже есть аккаунт? <a href="#" onclick="showLogin()">Войти</a></p>
                        </div>
                    </div>
                </div>

                <!-- Сообщения об ошибках -->
                <div id="alertContainer" class="mt-3"></div>
            </div>
        </div>
    </div>

    <!-- Скрипты -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
